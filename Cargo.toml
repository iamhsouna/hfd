[package]
name = "hfd"
version = "0.1.0"
edition = "2024"
description = "The fastest, smartest way to download models from the HuggingFace Hub"
license = "Apache-2.0"
keywords = ["huggingface", "download", "llm", "gguf", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "hfd"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
indicatif = "0.18.6"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"
